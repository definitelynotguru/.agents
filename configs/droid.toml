# droid.toml - unified droid hook config (selective adoption from ain3sh/.agents)

[hooks]

# ------------------------------------------------------------------------------
[hooks.session_start]

[hooks.session_start.environment]
when = ["startup", "resume", "clear"]
secrets = "~/.factory/.env"
path_prepend = ["~/.local/bin", "~/.npm-global/bin"]
export_session_id = true

[hooks.session_start.instructions]
prompts_dir = "~/.agents/prompts"
discover_ledgers = true

[[hooks.session_start.instructions.rules]]
when = ["compact"]
include = ["instructions/POST_COMPACT.md"]

[[hooks.session_start.instructions.rules]]
when = ["startup", "resume", "clear", "compact"]
include_text = ["""[Session history]
Current session ID: ${session_id}. Recover pre-compression history with `dsx search "<query>" --session ${session_id} --json`. Search when the summary lacks details, a prior decision needs checking, or you risk repeating work."""]

# ------------------------------------------------------------------------------
[hooks.pre_tool_use]

[hooks.pre_tool_use.policy]
[hooks.pre_tool_use.policy.allow]
tools = ["LS", "Read", "Grep", "Glob", "FetchUrl", "WebSearch"]
message = "[policy] {tool_name} auto-approved (read-only)"

[hooks.pre_tool_use.protect_paths]
enabled = true
protected_basenames = [
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "id_rsa",
    "id_ed25519",
    "auth.v2.*",
    "mcp-oauth.v2.*",
]
allowed_basenames = [
    ".env.example",
    ".env.sample",
    ".env.template",
    ".env.dist",
]
protected_segments = [".git", ".ssh"]

[hooks.pre_tool_use.rtk]
# Token-reduction proxy (https://github.com/rtk-ai/rtk). The hook calls
# `rtk rewrite` and, on success, mutates the Execute command in-flight.
# Transparent & fail-open: if rtk is missing, slow, or has no rewrite,
# the original command runs unmodified.
enabled = true

# Per-surface toggles. Absent keys default to enabled (true).
# Flip any misbehaving surface to `false` without disabling the whole hook.
[hooks.pre_tool_use.rtk.surfaces]
grep = false # Preserve ripgrep/grep flags such as --hidden and --glob.
rg = false   # rtk >= 1.x rewrites `rg` to surface `rg` instead of `grep`.

[hooks.pre_tool_use.tirith]
# Tirith terminal-security guard (https://github.com/sheeki03/tirith)
enabled   = true
fail_mode = "open"     # "closed" -> deny when tirith unavailable
timeout   = 5
tools     = ["Execute", "Bash"]
# Ainesh's pipe_to_interpreter false-positive filter: LHS commands that don't
# fetch or eval remote content.
pipe_to_interpreter_safe_lhs = [
    "git", "gh", "linear", "jq", "yq",
    "cat", "echo", "printf",
    "head", "tail", "awk", "sed", "tr", "cut",
    "ls", "find", "rg", "grep", "sort", "uniq",
]

[hooks.pre_tool_use.waits]
# Deny sleep/watch poll loops on GitHub PR/CI queries and foreground gh watch;
# redirect to babysit's background pr-watch script.
enabled = true

# ------------------------------------------------------------------------------
[hooks.post_tool_use]

[hooks.post_tool_use.instructions]
debug = false
prompts_dir = "~/.agents/prompts"

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = false }
include = ["instructions/IMPROVE_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true, isEdited = false }
include = ["instructions/IMPLEMENT_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true, isEdited = true }
include = ["instructions/IMPLEMENT_SPEC.md", "instructions/READ_EDITED_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true }
include = ["instructions/INIT_NOTES.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ProposeMission"
match.output = { approved = true }
include = ["instructions/INIT_NOTES.md"]

# ------------------------------------------------------------------------------
[hooks.subagent_stop.error_log]
# Append one JSONL record whenever a Task subagent returns a task_error.
enabled = true
log_path = "~/.local/state/droid-sessions/subagent-errors.jsonl"

# ------------------------------------------------------------------------------
[hooks.state_capture]
# Captures git/cwd/ledger/session metadata on PreCompact and SessionEnd.
enabled = true
state_dir = "~/.local/state/droid-sessions"
max_files = 200
